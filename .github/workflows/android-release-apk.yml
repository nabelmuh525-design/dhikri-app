name: Build DHIKRI Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enrich Offline Database with QuranEnc Arabic Tafsirs (Al-Muyassar & As-Siraj)
        run: python3 scripts/enrich_tafsir_from_quranenc.py

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode Fixed Release Keystore (if configured in Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.DHIKRI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "${{ github.workspace }}/dhikri-release.jks"
            echo "DHIKRI_KEYSTORE_PATH=${{ github.workspace }}/dhikri-release.jks" >> $GITHUB_ENV
          fi

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build Release APK
        env:
          DHIKRI_KEYSTORE_PASSWORD: ${{ secrets.DHIKRI_KEYSTORE_PASSWORD }}
          DHIKRI_KEY_ALIAS: ${{ secrets.DHIKRI_KEY_ALIAS }}
          DHIKRI_KEY_PASSWORD: ${{ secrets.DHIKRI_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload DHIKRI Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DHIKRI-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Extract App Version, Compute SHA-256 & Prepare Release Assets
        id: meta
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          cp app/build/outputs/apk/release/*.apk "DHIKRI-v${VERSION}.apk"
          sha256sum "DHIKRI-v${VERSION}.apk" > "DHIKRI-v${VERSION}.apk.sha256"

      - name: Publish Release for In-App Auto-Update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: "ذِكري v${{ steps.meta.outputs.version }}"
          body: "إصدار تطبيق ذِكري v${{ steps.meta.outputs.version }} — التحديث التلقائي الموثّق ببصمة SHA-256."
          files: |
            DHIKRI-v${{ steps.meta.outputs.version }}.apk
            DHIKRI-v${{ steps.meta.outputs.version }}.apk.sha256
