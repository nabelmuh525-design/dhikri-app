name: Build DHIKRI Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enrich Offline Database with QuranEnc Arabic Tafsirs (Al-Muyassar & As-Siraj)
        run: python3 scripts/enrich_tafsir_from_quranenc.py

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload DHIKRI Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DHIKRI-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
